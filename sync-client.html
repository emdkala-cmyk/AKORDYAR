<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0F131E" />
  <title>Akordyar — نمای نوازنده (گوشی)</title>
  <link rel="stylesheet" href="fonts/Vazirmatn.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; min-height: 100%; background: #0F131E !important; color: #E2E8F0; font-family: 'Vazirmatn', sans-serif; overflow: hidden; }
    body { margin: 0; }
    #pv-container { width: 100%; height: 100vh; overflow-y: auto; background: #0F131E !important; color: #E2E8F0; }
    #status-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 12px; font-size: 12px;
      background: rgba(15,19,30,0.85); backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(0,242,254,0.2);
    }
    #status-dot { width: 9px; height: 9px; border-radius: 50%; background: #fbbf24; display: inline-block; margin-left: 6px; }
    #status-dot.on { background: #4ade80; }
    #status-dot.off { background: #f87171; }
    #settings-btn { background: rgba(0,242,254,0.15); border: 1px solid rgba(0,242,254,0.4); color: #00F2FE; border-radius: 8px; padding: 7px 11px; font-family: inherit; cursor: pointer; }
    #settings-panel {
      position: fixed; top: 48px; right: 10px; left: 10px; z-index: 60;
      background: rgba(15,19,30,0.98); border-bottom: 1px solid rgba(0,242,254,0.3);
      padding: 14px; display: none; font-size: 13px; border: 1px solid rgba(0,242,254,0.3);
      border-radius: 14px; box-shadow: 0 14px 35px rgba(0,0,0,0.45);
    }
    #settings-panel.open { display: block; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 0; }
    .row label { color: #94a3b8; }
    .row input[type=range] { width: 62%; accent-color: #00F2FE; }
    .switch { width: 42px; height: 24px; accent-color: #00F2FE; }
    #timeline-bar {
      position: fixed; right: 0; bottom: 0; left: 0; z-index: 55;
      height: 104px; overflow: hidden; direction: ltr;
      background: #0D1017; border-top: 1px solid #30364A;
      box-shadow: 0 -5px 18px rgba(0,0,0,0.32);
      touch-action: none;
    }
    #timeline-controls { display: none; }
    #mobile-chord-timeline {
      position: absolute; inset: 0; overflow: hidden;
    }
    .mobile-timeline-ruler {
      position: relative; height: 22px; overflow: hidden;
      background: #0B0F16; border-bottom: 1px solid rgba(255,255,255,0.08);
      color: #8FA0B8; font: 9px/22px 'JetBrains Mono', monospace;
    }
    .mobile-timeline-ruler-track,
    .mobile-timeline-track {
      position: absolute; top: 0; left: 0; height: 100%;
      will-change: transform;
    }
    .mobile-timeline-ruler-track { pointer-events: none; }
    .mobile-timeline-bar-label {
      position: absolute; top: 0; display: block; min-width: 14px;
      color: #8FA0B8; text-align: left; white-space: nowrap;
    }
    .mobile-timeline-viewport {
      position: relative; height: 82px; overflow: hidden;
      background: #0D1017; touch-action: none;
    }
    .mobile-timeline-track {
      top: 0; height: 82px; background: transparent;
    }
    .mobile-timeline-grid,
    .mobile-timeline-clips {
      position: absolute; top: 0; left: 0; height: 82px;
      pointer-events: none;
    }
    .mobile-timeline-bar-line,
    .mobile-timeline-beat-line {
      position: absolute; top: 0; bottom: 0; width: 1px;
      pointer-events: none;
    }
    .mobile-timeline-bar-line { background: rgba(255,255,255,0.13); }
    .mobile-timeline-beat-line { background: rgba(255,255,255,0.045); }
    .mobile-timeline-chord {
      position: absolute; top: 18px; height: 58px; min-width: 30px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 9px; overflow: hidden; white-space: nowrap;
      border: 1px solid #9F7AEA; border-radius: 7px;
      color: #fff; font: 800 16px/1 'JetBrains Mono', monospace;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      text-overflow: ellipsis;
    }
    .mobile-timeline-playhead {
      position: absolute; top: 0; bottom: 0; left: 50%; width: 2px;
      z-index: 20; transform: translateX(-1px); pointer-events: none;
      background: #00F2FE; box-shadow: 0 0 10px rgba(0,242,254,0.8);
    }
    .hint { text-align: center; color: #64748b; margin-top: 20vh; font-size: 14px; padding: 0 20px; }
  </style>
</head>
<body>
  <div id="status-bar">
    <span><span id="status-dot"></span><span id="status-text">در حال اتصال...</span></span>
    <button id="settings-btn">تنظیمات نمایش</button>
  </div>

  <div id="settings-panel">
    <div class="row">
      <label>اندازه متن و آکورد</label>
      <input id="set-fontSize" type="range" min="14" max="42" step="1" value="20" />
    </div>
    <div class="row">
      <label>نمایش آکوردها</label>
      <input id="set-showChords" class="switch" type="checkbox" checked />
    </div>
  </div>

  <div id="pv-container">
    <div class="hint" id="hint">منتظر اتصال به لپتاپ...<br/>وقتی آهنگ پخش شود، اینجا نمایش داده میشود.</div>
  </div>
  <div id="timeline-bar">
    <div id="mobile-chord-timeline" aria-label="chord timeline"></div>
    <div id="timeline-controls">
      <button id="timeline-stop" type="button" title="توقف">■</button>
      <button id="timeline-play" type="button" title="پخش">▶</button>
      <input id="timeline-range" type="range" min="0" max="0" step="0.01" value="0" />
      <span id="timeline-time">00:00 / 00:00</span>
    </div>
  </div>

  <div id="debug-log" style="position:fixed;bottom:0;left:0;right:0;z-index:70;max-height:30vh;overflow-y:auto;background:rgba(0,0,0,0.85);color:#0f0;font:11px monospace;padding:4px 8px;display:none;border-top:1px solid #0f0;"></div>

  <!-- پروتکل مشترک -->
  <script src="js/sync/protocol.js?v=20260813-9"></script>
  <!-- رندرر نوازنده (همان پنل F9 دسکتاپ) -->
  <script src="js/playerViewRenderer.js?v=20260813-9"></script>
  <script src="js/sync/mobileTimeline.js?v=20260813-9"></script>
  <!-- کلاینت گوشی -->
  <script src="js/sync/mobileClient.js?v=20260813-9"></script>

  <script>
    const container = document.getElementById('pv-container');
    const hint = document.getElementById('hint');
    const dot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const settingsBtn = document.getElementById('settings-btn');
    const settingsPanel = document.getElementById('settings-panel');
    const timelineRange = document.getElementById('timeline-range');
    const timelinePlay = document.getElementById('timeline-play');
    const timelineStop = document.getElementById('timeline-stop');
    const timelineTime = document.getElementById('timeline-time');

    function updateStatus(on) {
      dot.className = on ? 'on' : 'off';
      statusText.textContent = on ? 'متصل به لپتاپ' : 'قطع شد — در حال تلاش مجدد...';
    }

    function formatTimelineTime(seconds) {
      const value = Math.max(0, Number(seconds) || 0);
      const mins = Math.floor(value / 60);
      const secs = Math.floor(value % 60);
      return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    function updatePlaybackUI(playback) {
      const time = Math.max(0, Number(playback?.time) || 0);
      const duration = Math.max(0, Number(playback?.duration) || 0);
      timelineRange.max = String(duration);
      timelineRange.value = String(Math.min(time, duration || time));
      timelinePlay.textContent = playback?.isPlaying ? '❚❚' : '▶';
      timelineTime.textContent =
        formatTimelineTime(time) + ' / ' + formatTimelineTime(duration);
    }
    window.updatePlaybackUI = updatePlaybackUI;
    const timelineRoot = document.getElementById('mobile-chord-timeline');
    const mobileTimeline = window.MobileChordTimeline?.create(timelineRoot, {
      onSeek: time => window.AkordMobileClient?.seek?.(time)
    });
    window.updateMobileTimeline = (timeline, playback) => {
      mobileTimeline?.setTimeline?.(timeline || {});
      mobileTimeline?.setPlayback?.(playback || {});
    };

    // ===== لاگ دیباگ (موقت) =====
    const debugLog = document.getElementById('debug-log');
    let dbgCount = 0;
    function dbg(msg) {
      dbgCount++;
      const line = document.createElement('div');
      line.textContent = '[' + dbgCount + '] ' + msg + ' @' + new Date().toLocaleTimeString('fa-IR');
      debugLog.appendChild(line);
      while (debugLog.children.length > 50) debugLog.removeChild(debugLog.firstChild);
      debugLog.scrollTop = debugLog.scrollHeight;
    }
    window.dbg = dbg;
    // دکمه نمایش لاگ: ۳ بار روی نوار وضعیت بزن
    let tapCount = 0, tapTimer = null;
    document.getElementById('status-bar').addEventListener('click', () => {
      tapCount++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => { tapCount = 0; }, 600);
      if (tapCount >= 3) {
        tapCount = 0;
        debugLog.style.display = debugLog.style.display === 'block' ? 'none' : 'block';
      }
    });
    dbg('صفحه گوشی لود شد');

    // مخفی کردن hint وقتی اولین بار رندر شد
    const _origRender = window.PlayerViewRenderer ? null : null;
    const observer = new MutationObserver(() => {
      if (container.querySelector('[data-line-id]')) { hint.style.display = 'none'; observer.disconnect(); }
    });
    observer.observe(container, { childList: true, subtree: true });

    window.AkordMobileClient.init(container);
    const initialMobileView = window.AkordMobileClient.getLocalView();
    document.getElementById('set-fontSize').value =
      String(initialMobileView.fontSize || 20);
    document.getElementById('set-showChords').checked =
      initialMobileView.showChords !== false;

    // ===== تنظیمات محلی گوشی (فقط روی این دستگاه) =====
    settingsBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      settingsPanel.classList.toggle('open');
    });
    document.addEventListener('click', (event) => {
      if (
        settingsPanel.classList.contains('open') &&
        !settingsPanel.contains(event.target) &&
        event.target !== settingsBtn
      ) settingsPanel.classList.remove('open');
    });
    const map = {
      'set-fontSize': ['fontSize', v => parseInt(v, 10)],
      'set-showChords': ['showChords', v => v.checked]
    };
    Object.keys(map).forEach(id => {
      const [key, conv] = map[id];
      document.getElementById(id).addEventListener('input', (e) => {
        const patch = {}; patch[key] = conv(e.target);
        window.AkordMobileClient.setLocalView(patch);
      });
    });

    timelinePlay.addEventListener('click', () => {
      window.AkordMobileClient.requestTransport(
        timelinePlay.textContent === '▶' ? 'play' : 'pause'
      );
    });
    timelineStop.addEventListener('click', () => {
      window.AkordMobileClient.requestTransport('stop');
    });
    timelineRange.addEventListener('input', () => {
      window.AkordMobileClient.seek(parseFloat(timelineRange.value));
    });
  </script>
</body>
</html>
