<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0F131E" />
  <title>Akordyar — نمای نوازنده (گوشی)</title>
  <link rel="stylesheet" href="fonts/Vazirmatn.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; min-height: 100%; background: #0F131E !important; color: #E2E8F0; font-family: 'Vazirmatn', sans-serif; overflow: hidden; }
    body { margin: 0; }
    #pv-container { width: 100%; height: 100vh; overflow-y: auto; background: #0F131E; color: #E2E8F0; }
    #status-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 12px; font-size: 12px;
      background: rgba(15,19,30,0.85); backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(0,242,254,0.2);
    }
    #status-dot { width: 9px; height: 9px; border-radius: 50%; background: #fbbf24; display: inline-block; margin-left: 6px; }
    #status-dot.on { background: #4ade80; }
    #status-dot.off { background: #f87171; }
    #settings-btn { background: rgba(0,242,254,0.15); border: 1px solid rgba(0,242,254,0.4); color: #00F2FE; border-radius: 8px; padding: 4px 10px; font-family: inherit; cursor: pointer; }
    #settings-panel {
      position: fixed; top: 40px; left: 0; right: 0; z-index: 60;
      background: rgba(15,19,30,0.98); border-bottom: 1px solid rgba(0,242,254,0.3);
      padding: 14px; display: none; font-size: 13px;
    }
    #settings-panel.open { display: block; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
    .row label { color: #94a3b8; }
    .row input[type=range] { width: 55%; }
    .row input[type=color] { width: 42px; height: 28px; border: none; background: none; }
    .row select { background: #1e293b; color: #E2E8F0; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 3px 6px; font-family: inherit; }
    .hint { text-align: center; color: #64748b; margin-top: 20vh; font-size: 14px; padding: 0 20px; }
  </style>
</head>
<body>
  <div id="status-bar">
    <span><span id="status-dot"></span><span id="status-text">در حال اتصال…</span></span>
    <button id="settings-btn">تنظیمات نمایش</button>
  </div>

  <div id="settings-panel">
    <div class="row">
      <label>اندازه فونت</label>
    <input id="set-fontSize" type="range" min="14" max="48" step="1" value="20" />
    </div>
    <div class="row">
      <label>فونت</label>
      <select id="set-fontFamily">
        <option value="Vazirmatn">وزیرمتن</option>
        <option value="JetBrains Mono">JetBrains Mono</option>
        <option value="sans-serif">ساده</option>
      </select>
    </div>
    <div class="row">
      <label>رنگ متن</label>
      <input id="set-textColor" type="color" value="#E2E8F0" />
    </div>
    <div class="row">
      <label>رنگ آکورد</label>
      <input id="set-chordColor" type="color" value="#00F2FE" />
    </div>
    <div class="row">
      <label>رنگ هایلایت</label>
      <input id="set-highlightColor" type="color" value="#FF2E93" />
    </div>
    <div class="row">
      <label>زوم</label>
      <input id="set-scale" type="range" min="0.7" max="1.6" step="0.05" value="1" />
    </div>
    <div class="row">
      <label>نمایش آکوردها</label>
      <input id="set-showChords" type="checkbox" checked />
    </div>
  </div>

  <div id="pv-container">
    <div class="hint" id="hint">منتظر اتصال به لپتاپ...<br/>وقتی آهنگ پخش شود، اینجا نمایش داده میشود.</div>
  </div>

  <div id="debug-log" style="position:fixed;bottom:0;left:0;right:0;z-index:70;max-height:30vh;overflow-y:auto;background:rgba(0,0,0,0.85);color:#0f0;font:11px monospace;padding:4px 8px;display:none;border-top:1px solid #0f0;"></div>

  <!-- پروتکل مشترک -->
  <script src="js/sync/protocol.js"></script>
  <!-- رندرر نوازنده (همان پنل F9 دسکتاپ) -->
  <script src="js/playerViewRenderer.js?v=20260813-5"></script>
  <!-- کلاینت گوشی -->
  <script src="js/sync/mobileClient.js"></script>

  <script>
    const container = document.getElementById('pv-container');
    const hint = document.getElementById('hint');
    const dot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const settingsBtn = document.getElementById('settings-btn');
    const settingsPanel = document.getElementById('settings-panel');

    function updateStatus(on) {
      dot.className = on ? 'on' : 'off';
      statusText.textContent = on ? 'متصل به لپتاپ' : 'قطع شد — در حال تلاش مجدد...';
    }

    // ===== لاگ دیباگ (موقت) =====
    const debugLog = document.getElementById('debug-log');
    let dbgCount = 0;
    function dbg(msg) {
      dbgCount++;
      const line = document.createElement('div');
      line.textContent = '[' + dbgCount + '] ' + msg + ' @' + new Date().toLocaleTimeString('fa-IR');
      debugLog.appendChild(line);
      while (debugLog.children.length > 50) debugLog.removeChild(debugLog.firstChild);
      debugLog.scrollTop = debugLog.scrollHeight;
    }
    window.dbg = dbg;
    // دکمه نمایش لاگ: ۳ بار روی نوار وضعیت بزن
    let tapCount = 0, tapTimer = null;
    document.getElementById('status-bar').addEventListener('click', () => {
      tapCount++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => { tapCount = 0; }, 600);
      if (tapCount >= 3) {
        tapCount = 0;
        debugLog.style.display = debugLog.style.display === 'block' ? 'none' : 'block';
      }
    });
    dbg('صفحه گوشی لود شد');

    // مخفی کردن hint وقتی اولین بار رندر شد
    const _origRender = window.PlayerViewRenderer ? null : null;
    const observer = new MutationObserver(() => {
      if (container.querySelector('[data-line-id]')) { hint.style.display = 'none'; observer.disconnect(); }
    });
    observer.observe(container, { childList: true, subtree: true });

    window.AkordMobileClient.init(container);

    // ===== تنظیمات محلی گوشی (فقط روی این دستگاه) =====
    settingsBtn.addEventListener('click', () => settingsPanel.classList.toggle('open'));
    const map = {
      'set-fontSize': ['fontSize', v => parseInt(v, 10)],
      'set-fontFamily': ['fontFamily', v => v],
      'set-textColor': ['textColor', v => v],
      'set-chordColor': ['chordColor', v => v],
      'set-highlightColor': ['highlightColor', v => v],
      'set-scale': ['scale', v => parseFloat(v)],
      'set-showChords': ['showChords', v => v.checked]
    };
    Object.keys(map).forEach(id => {
      const [key, conv] = map[id];
      document.getElementById(id).addEventListener('input', (e) => {
        const patch = {}; patch[key] = conv(e.target);
        window.AkordMobileClient.setLocalView(patch);
      });
    });
  </script>
</body>
</html>
